# nginx reverse proxy config for recon-agent
# Place at: /etc/nginx/sites-available/recon-agent
# Enable with: ln -s /etc/nginx/sites-available/recon-agent /etc/nginx/sites-enabled/
#
# After certbot runs, it will modify this file to add SSL config automatically.
# The HTTP block below is the pre-certbot starting point.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;   # Replace with your VPS IP or domain name

    # Proxy Slack event and action webhooks to the local bot process
    location /slack/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Slack requires responses within 3 seconds — keep timeouts tight
        proxy_read_timeout  10s;
        proxy_send_timeout  10s;
        proxy_connect_timeout 5s;
    }

    # Health check endpoint (optional, useful for uptime monitoring)
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Block everything else
    location / {
        return 404;
    }
}

# ── After running certbot, the HTTPS block below will be auto-generated. ──────
